server {
    listen 80;
    server_name nexuscut.io www.nexuscut.io nexuscut.com www.nexuscut.com 209.74.79.56;
    return 301 https://nexuscut.io$request_uri;
}

# Keep every alternate host on a single public URL. The certificate covers the
# www host, allowing visitors and crawlers to receive the redirect over HTTPS.
server {
    listen 443 ssl;
    server_name www.nexuscut.io nexuscut.com www.nexuscut.com;

    ssl_certificate /etc/letsencrypt/live/nexuscut.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexuscut.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nexuscut.io$request_uri;
}

server {
    listen 443 ssl;
    server_name nexuscut.io 209.74.79.56;

    ssl_certificate /etc/letsencrypt/live/nexuscut.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexuscut.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/backend-transcribe {
        proxy_pass http://localhost:3001/api/transcribe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        client_max_body_size 250M;
    }

    # ads.txt is a static seller file. Serving it from nginx means AdSense can
    # always read it, regardless of which Next.js build is currently deployed
    # (the app build does not pick up files added to public/ afterwards).
    location = /ads.txt {
        alias /var/www/nexuscut/public/ads.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 250M;
    }
}
