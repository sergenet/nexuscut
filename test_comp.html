<!DOCTYPE html>
<html>
<body>
<canvas id="c" width="200" height="200"></canvas>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  
  // Fill black with 255 alpha
  const imgData = ctx.createImageData(200, 200);
  for(let i=0; i<imgData.data.length; i+=4) {
    imgData.data[i] = 0; // R
    imgData.data[i+1] = 0; // G
    imgData.data[i+2] = 0; // B
    imgData.data[i+3] = 255; // A
  }
  ctx.putImageData(imgData, 0, 0);
  
  // Draw red square with source-in
  ctx.globalCompositeOperation = 'source-in';
  ctx.fillStyle = 'red';
  ctx.fillRect(0, 0, 200, 200);
  
  // Check if it's red or black
  const check = ctx.getImageData(0,0,1,1).data;
  console.log("Color:", check[0], check[1], check[2], check[3]);
</script>
</body>
</html>
